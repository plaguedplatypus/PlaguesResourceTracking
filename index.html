<!DOCTYPE html>
<html>

<head>
    <link rel="stylesheet" type="text/css" href="https://runeapps.org/nis/nis.css" />

    <link rel="stylesheet" type="text/css" href="https://runeapps.org/runeappslib.css" />
</head>

<body class="nis">
    <div class="app">
        <div>
            <div class="title">
                <button class="tabs-toggle" title="Compact Mode">-</button>
                <button class="compact-sort-button compact-only" title="Sort">⇵</button>
                Resource Tracker
            </div>
        </div>
        <div class="skill-tabs">
            <button class="skill-tab active" data-skill="all">All</button>
            <button class="skill-tab" data-skill="mining" title="Mining">
                <img src="./icons/mining.png" alt="Mining">
            </button>

            <button class="skill-tab" data-skill="woodcutting" title="Woodcutting">
                <img src="./icons/woodcutting.png" alt="Woodcutting">
            </button>

            <button class="skill-tab" data-skill="fishing" title="Fishing">
                <img src="./icons/fishing.png" alt="Fishing">
            </button>

            <button class="skill-tab" data-skill="archaeology" title="Archaeology">
                <img src="./icons/archaeology.png" alt="Archaeology">
            </button>

            <button class="skill-tab" data-skill="invention" title="Invention">
                <img src="./icons/invention.png" alt="Invention">
            </button>

            <button class="skill-tab" data-skill="seren" title="Seren Spirits">
                <img src="./icons/seren.png" alt="Seren">
            </button>

        </div>

        <div class="invention-filters">
            <button class="invention-filter-cycle">Filter: All</button>
        </div>

        <div class="fishing-mode">
            <button class="fishing-porters-cycle" title="Toggle fishing tracking mode">
                Porters / GOTE: ON
            </button>
        </div>

        <div class="tracker"></div>

        <div class="footer-separator"></div>

        <div class="footer">
            <span class="status">Initializing...</span>

            <div class="app-settings">
                <button class="sort-button" title="Sort">⇵</button>
                <button class="app-cog" title="Settings">⚙</button>
            </div>
        </div>

        <div class="app-settings-panel">
            <div class="settings-row">
                <select class="chat">
                    <option value="">Select Chat</option>
                </select>
                <button class="find-chat">Find Chat</button>
            </div>

            <div class="settings-row">
                <button class="history-button">History</button>
                <button class="session-button">Session</button>
            </div>


            <div class="settings-row">
                <button class="export">Export</button>

                <label class="import-label">
                    Import
                    <input class="import" type="file" accept=".json">
                </label>
            </div>
            <div class="session-status-line idle">
                <span class="session-status-label">Session:</span>
                <span class="session-status-value">Not Running</span>
            </div>

            <div class="settings-separator"></div>
            <button class="clear">Clear Tab</button>
            <div class="settings-footer-links">
            <!--<button class="settings-text-link settings-discord" type="button">Join the Discord</button>
            --><button class="settings-text-link settings-version" type="button"></button>
            </div>
        </div>

        <script src="./main.js"></script>
</body>

</html>
